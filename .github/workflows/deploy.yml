name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Public by design: the Supabase project URL and anon key are shipped in every
          # page's JavaScript; access is enforced by row-level security, not by hiding these.
          VITE_SUPABASE_URL: https://amblonweizpfqdebersh.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtYmxvbndlaXpwZnFkZWJlcnNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjE0MTQsImV4cCI6MjA5ODEzNzQxNH0.xkLVwxidlKcOjKJEjrX02Kt51kOasg4VaAaRHj20CQk
      - run: node scripts/spa-fallback.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
